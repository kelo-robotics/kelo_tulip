/**:
  ros__parameters:
    num_wheels: 4
    device: eno1

    #vlin_max: 1.2  # m / s
    #va_max: 1.1  # rad / s
    #vlin_acc_max: 0.4  # m / s^2
    #vlin_dec_max: 1.0  # m / s^2
    #va_acc_max: 0.5  # rad / s^2
    #va_dec_max: 1.0  # rad / s^2

    wheel_models:
      KD108:
        diameter: 0.107
        width: 0.04
        casteroffset: 0.01
        wheeldistance: 0.11
        velocitylimit: 100.0
        currentlimit: 1.0
        standbycurrent: 0.1
        canPivot: true

    wheel0:
      model: KD108
      ethercat_number: 3
      x: 0.233
      y: 0.1165
      a: 1.57

    wheel1:
      model: KD108
      ethercat_number: 5
      x: -0.233
      y: 0.1165
      a: 1.57

    wheel2:
      model: KD108
      ethercat_number: 7
      x: -0.233
      y: -0.1165
      a: 1.57

    wheel3:
      model: KD108
      ethercat_number: 9
      x: 0.233
      y: -0.1165
      a: 1.57

platform_driver:
  ros__parameters:
    modules:
      list: ["platform_driver"]
      platform_driver:
        type: platform_driver
        controller: velocity_platform_controller

